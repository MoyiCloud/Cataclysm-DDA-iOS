name: Build CDDA iOS
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Install deps
        run: brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer gettext
      
      - name: List all Schemes (调试找名字)
        run: xcodebuild -workspace CDDA.xcworkspace -list
      
      - name: Build Archive
        run: |
          xcodebuild archive \
            -workspace CDDA.xcworkspace \
            -scheme CDDA \
            -sdk iphoneos \
            -configuration Release \
            -archivePath CDDA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--force"
      
      - uses: actions/upload-artifact@v4
        with:
          name: CDDA-Build
          path: CDDA.xcarchive

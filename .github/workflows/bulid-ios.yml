name: Build CDDA iOS
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      # 1. 拉取代码（暂不拉子模块）
      - uses: actions/checkout@v4
        with:
          submodules: false

      # 2. 修复方法：直接删除损坏条目（用 awk 重写，避免 sed -i 兼容问题）
      - name: Fix broken submodule entry
        run: |
          # 用 awk 过滤掉包含 Cataclysm-BN 的行，生成新文件覆盖旧的
          awk '!/Cataclysm-BN/' .gitmodules > .gitmodules.tmp && mv .gitmodules.tmp .gitmodules
          cat .gitmodules

      # 3. 拉取剩余正常子模块
      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init --recursive || echo "忽略非关键子模块错误"

      # 4. 安装依赖库
      - name: Install deps
        run: brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer gettext

      # 5. 列出所有方案
      - name: List all Schemes
        run: xcodebuild -workspace CDDA.xcworkspace -list

      # 6. 智能编译打包
      - name: Build Archive
        run: |
          SCHEME=$(xcodebuild -workspace CDDA.xcworkspace -list | grep -E '^\s+Cataclysm|CDDA' | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="CDDA"
          fi
          echo "检测到的方案名: $SCHEME"

          xcodebuild archive \
            -workspace CDDA.xcworkspace \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath CDDA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--force" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_WARN_DOCUMENTATION_COMMENTS=NO

      # 7. 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: CDDA-Build
          path: CDDA.xcarchive
